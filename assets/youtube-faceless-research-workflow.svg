        <path d="M18 48 C27 28 34 37 42 22 C50 37 56 16 64 24" fill="none" stroke="#65dcff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="64" cy="24" r="5" fill="#61f2b5"/>
      </g>
      <text x="122" y="48" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Evidence before ranking</text>
      <text x="122" y="79" fill="#b9d1e2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">No invented volume or growth metrics</text>
