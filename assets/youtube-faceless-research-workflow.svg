      <path d="M47 27 H109 M47 44 H99 M47 61 H84" stroke="#6adeff" stroke-width="5" stroke-linecap="round"/>
      <text x="78" y="86" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Deduplicate</text>
    </g>
    <g transform="translate(404 253)">
      <rect width="156" height="104" rx="22" fill="#102c45" stroke="#31caff" stroke-opacity="0.55"/>
      <path d="M49 26 H107 V67 H49 Z" fill="none" stroke="#6adeff" stroke-width="4"/>
      <path d="M62 39 L70 47 L86 31 M62 58 L70 66 L86 50" fill="none" stroke="#61f2b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="88" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">QA</text>
