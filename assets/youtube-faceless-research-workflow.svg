      <line x1="84" y1="60" x2="104" y2="80" stroke="#61f2b5" stroke-width="6" stroke-linecap="round"/>
      <path d="M56 43 L64 51 L80 33" fill="none" stroke="#61f2b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="91" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Validate</text>
    </g>
