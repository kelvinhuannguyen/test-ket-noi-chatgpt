    </g>
    <g transform="translate(764 101)">
      <rect width="102" height="118" rx="22" fill="#102c45" stroke="#61f2b5" stroke-opacity="0.75"/>
      <path d="M51 19 L79 30 V50 C79 67 67 78 51 85 C35 78 23 67 23 50 V30 Z" fill="#1e745f" fill-opacity="0.55" stroke="#61f2b5" stroke-width="3"/>
      <path d="M38 51 L47 60 L66 40" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="105" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Filter</text>
