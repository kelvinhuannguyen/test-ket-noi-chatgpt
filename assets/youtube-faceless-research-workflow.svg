      <text x="78" y="43" text-anchor="middle" fill="#6adeff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">#1</text>
      <text x="78" y="75" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Rank</text>
