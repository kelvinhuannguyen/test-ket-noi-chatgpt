<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Faceless Trend Research workflow</title>
  <desc id="desc">Professional infographic showing the path from market signals through validation and scoring to a quality-assured Excel deliverable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08172e"/>
      <stop offset="0.55" stop-color="#0d3150"/>
      <stop offset="1" stop-color="#075c64"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d3ff"/>
      <stop offset="1" stop-color="#61f2b5"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ed790"/>
      <stop offset="1" stop-color="#0da86c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b9eaff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020814" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1385" cy="88" r="190" fill="#39e6b2" opacity="0.07"/>
  <circle cx="127" cy="506" r="210" fill="#2e8cff" opacity="0.08"/>

  <g transform="translate(86 74)">
    <rect width="76" height="54" rx="16" fill="#ff365f" filter="url(#glow)"/>
    <path d="M31 15 L55 27 L31 39 Z" fill="#fff"/>
    <text x="98" y="24" fill="#7fe7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">RESEARCH SYSTEM</text>
    <text x="0" y="111" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800">YouTube Faceless</text>
    <text x="0" y="165" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800">Trend Research</text>
    <text x="0" y="211" fill="#c9dbea" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Signals → validation → opportunity → delivery</text>

    <g transform="translate(0 270)">
      <rect width="440" height="124" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <g transform="translate(24 22)">
